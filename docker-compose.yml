version: '3.8'

services:
  career-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_copilot_service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - copilot-sqlite:/app/data
    restart: always

volumes:
  copilot-sqlite:
    driver: local
